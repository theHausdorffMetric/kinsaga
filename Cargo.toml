[package]
name = "kinsaga"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["Daniel Probst <daniel@probst.dev>"]
description = "A family chronicle library and CLI for managing timestamped, categorized life events"
license = "GPL-3.0-or-later"
repository = "https://git.sr.ht/~danprobst/kinsaga"
keywords = ["family", "chronicle", "genealogy", "timeline", "history"]
categories = ["command-line-utilities", "data-structures"]
readme = "README.md"
exclude = ["STATUS.md", "CODE_REVIEW.md", ".build.yml"]

[[bin]]
name = "kinsaga"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.23", features = ["v4"] }
clap = { version = "4.6", features = ["derive", "env"] }
dotenvy = "0.15"
colored = "3.1"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
url = { version = "2.5", features = ["serde"] }
regex = "1.13"
tempfile = "3.27"
ureq = "3.3"
urlencoding = "2.1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
