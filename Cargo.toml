[package]
name = "kinsaga"
version = "0.2.1"
edition = "2024"
authors = ["Daniel Probst <daniel@probst.dev>"]
description = "A family chronicle library and CLI for managing timestamped, categorized life events"
license = "GPL-3.0-or-later"
repository = "https://git.sr.ht/~danprobst/kinsaga"
keywords = ["family", "chronicle", "genealogy", "timeline", "history"]
categories = ["command-line-utilities", "data-structures"]
readme = "README.md"
exclude = ["STATUS.md", "CODE_REVIEW.md"]

[[bin]]
name = "kinsaga"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.23", features = ["v4"] }
clap = { version = "4.6", features = ["derive", "env"] }
dotenvy = "0.15"
colored = "3.1"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
url = { version = "2.5", features = ["serde"] }
regex = "1.13"
ureq = "3.3"
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3.27"
