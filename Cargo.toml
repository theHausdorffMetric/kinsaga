[package]
name = "kinsaga"
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
authors = ["Daniel Probst <daniel@probst.dev>"]
description = "A family chronicle library and CLI for managing timestamped, categorized life events"
license = "GPL-3.0-or-later"
repository = "https://github.com/theHausdorffMetric/kinsaga"
keywords = ["family", "chronicle", "genealogy", "timeline", "history"]
categories = ["command-line-utilities", "data-structures"]
readme = "README.md"
include = ["src/**", "tests/*.rs", "!tests/skill_doc_sync.rs", "/examples/sample-chronicle.json", "/schema.json", "/README.md", "/LICENSE"]

[[bin]]
name = "kinsaga"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.23", features = ["v4"] }
clap = { version = "4.6", features = ["derive", "env"] }
dotenvy = "0.15"
colored = "3.1"
anyhow = "1.0"
jiff = "0.2"
url = { version = "2.5", features = ["serde"] }
regex = "1.13"
tempfile = "3.27"
ureq = "3.3"
rust_iso3166 = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
